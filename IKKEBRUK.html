<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e16">
<meta name="description" content="CrowdCam – kiss cam og look-a-like for storskjerm, styrt fra mobilen.">
<title>CrowdCam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap">
<style id="stage-css">
/* Stage: det publikum ser. Alle mål i cqh/cqw, så samme komposisjon kan vises i forhåndsvisning, mobil og storskjerm. */
.st{--st-bg:#07080e;--st-ink:#fff;--st-kiss:#ff3d7f;--st-kiss-2:#ff9dbd;--st-kiss-3:#e0164f;--st-look:#ffc83d;--st-live:#ff2e4d;
  position:relative;width:100%;height:100%;overflow:hidden;background:var(--st-bg);color:var(--st-ink);container-type:size;
  font-family:Anton,Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;line-height:1;-webkit-user-select:none;user-select:none}
.st *{box-sizing:border-box}
.st-layer{position:absolute;inset:0;transition:opacity .5s ease,visibility .5s}
.st[data-show="neutral"] .st-program,.st[data-show="program"] .st-neutral{opacity:0;visibility:hidden}

/* Nøytral skjerm */
.st-neutral{display:grid;place-items:center;overflow:hidden;background:
  radial-gradient(70% 55% at 50% 115%,rgba(255,200,61,.20),transparent 70%),
  radial-gradient(45% 70% at 8% -15%,rgba(255,61,127,.30),transparent 70%),
  radial-gradient(45% 70% at 92% -15%,rgba(90,120,255,.28),transparent 70%),var(--st-bg)}
.st-beam{position:absolute;top:-10cqh;width:46cqw;height:150cqh;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 70%);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;animation:st-sweep 10s ease-in-out infinite alternate;pointer-events:none}
.st-beam.l{left:-8cqw;--a:-34deg;--b:6deg}
.st-beam.r{right:-8cqw;--a:34deg;--b:-6deg;animation-delay:-5s}
@keyframes st-sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
.st-bulbs{position:absolute;left:0;right:0;height:3cqh;background-repeat:repeat-x;
  background-image:radial-gradient(circle,var(--st-look) 0 24%,rgba(255,200,61,.35) 30% 40%,transparent 44%),radial-gradient(circle,rgba(255,200,61,.22) 0 24%,transparent 28%);
  background-size:8cqh 3cqh,8cqh 3cqh;background-position:0 0,4cqh 0;animation:st-chase 1s steps(1,end) infinite}
.st-bulbs.t{top:2.4cqh}
.st-bulbs.b{bottom:2.4cqh;animation-delay:-.5s}
@keyframes st-chase{0%{background-position:0 0,4cqh 0}50%{background-position:4cqh 0,0 0}}
.st-n-text{position:relative;text-align:center;padding:0 9cqw;max-width:100%}
.st-n-title{font-size:17cqh;text-transform:uppercase;letter-spacing:.015em;text-wrap:balance;text-shadow:0 .6cqh 3cqh rgba(0,0,0,.5)}
.st-n-sub{font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:4.4cqh;line-height:1.3;margin-top:3.5cqh;color:rgba(255,255,255,.8);text-wrap:balance}
.st-n-sub:empty{display:none}
.st-n-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.st[data-nimg="1"] .st-n-img{display:block}
.st[data-nimg="1"] .st-n-text,.st[data-nimg="1"] .st-beam{display:none}

/* Program: livebilde + valgt bilde/filter */
.st-program{display:grid;grid-template-columns:100%;grid-template-rows:100%;background:var(--st-bg)}
.st-img,.st-vid{position:relative;overflow:hidden;background:#000;min-width:0;min-height:0}
.st-img{display:none}
.st-img img{position:absolute;inset:0;width:100%;height:100%}
.st-img-bg{object-fit:cover;filter:blur(3cqh) brightness(.45) saturate(1.2);transform:scale(1.15)}
.st-img-fg{object-fit:contain}
.st-vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;transition:transform .12s linear;background:#000}
.st-wait{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:4cqh;font-family:Archivo,system-ui,sans-serif;font-weight:600;font-size:4cqh;color:rgba(255,255,255,.55)}
.st[data-stream="0"] .st-wait{display:grid}

/* Look-a-like: bilde og livebilde side om side */
.st[data-layout="split"] .st-program{grid-template-columns:1fr 1fr;column-gap:1.4cqw;padding:13cqh 2.6cqw 3.4cqh;
  background:radial-gradient(80% 60% at 50% 0,rgba(255,200,61,.18),transparent 70%),var(--st-bg)}
.st[data-layout="split"] .st-img{display:block}
.st[data-layout="split"] .st-img,.st[data-layout="split"] .st-vid{border-radius:1.8cqh;box-shadow:0 0 0 .45cqh var(--st-look),0 2cqh 6cqh rgba(0,0,0,.6)}
.st-title{position:absolute;top:0;left:0;right:0;height:13cqh;display:none;align-items:center;justify-content:center;padding:0 4cqw;
  font-size:8.5cqh;letter-spacing:.06em;text-transform:uppercase;color:var(--st-look);text-shadow:0 0 3cqh rgba(255,200,61,.45);white-space:nowrap;overflow:hidden}
.st[data-layout="split"] .st-title{display:flex}
.st-approx{position:absolute;left:50%;top:54.8cqh;width:13cqh;height:13cqh;margin:-6.5cqh 0 0 -6.5cqh;border-radius:50%;background:var(--st-look);color:#1a1300;
  display:none;place-items:center;font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:8.5cqh;line-height:1;padding-bottom:.6cqh;
  box-shadow:0 0 0 .8cqh var(--st-bg),0 1cqh 4cqh rgba(0,0,0,.6)}
.st[data-layout="split"] .st-approx{display:grid}
.st-plate{position:absolute;left:2.2cqh;bottom:2.2cqh;max-width:calc(100% - 4.4cqh);padding:1.3cqh 2.2cqh 1.1cqh;border-radius:1cqh;background:rgba(7,8,14,.82);
  font-size:5cqh;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none;align-items:center;gap:1.4cqh}
.st[data-layout="split"] .st-plate{display:flex}
.st[data-layout="split"] .st-plate:empty{display:none}
.st-plate i,.st-bug i{flex:none;width:1.8cqh;height:1.8cqh;border-radius:50%;background:var(--st-live);box-shadow:0 0 1.6cqh var(--st-live);animation:st-blink 1.2s ease-in-out infinite}
@keyframes st-blink{50%{opacity:.35}}
.st[data-show="program"][data-layout="split"] .st-img{animation:st-in-l .7s cubic-bezier(.2,.9,.2,1) both}
.st[data-show="program"][data-layout="split"] .st-vid{animation:st-in-r .7s cubic-bezier(.2,.9,.2,1) .08s both}
.st[data-show="program"][data-layout="split"] .st-approx{animation:st-pop .5s cubic-bezier(.3,1.6,.5,1) .45s both}
@keyframes st-in-l{from{transform:translateX(-40%);opacity:0}}
@keyframes st-in-r{from{transform:translateX(40%);opacity:0}}
@keyframes st-pop{from{transform:scale(0)}}

/* Kiss cam, egne rammer og live-merke */
.st-hearts,.st-kissbar,.st-ovl,.st-bug{display:none}
.st-hearts{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 14cqh rgba(255,61,127,.55),inset 0 0 0 1cqh rgba(255,61,127,.35)}
.st[data-kind="kiss"] .st-hearts{display:block}
.st-heart{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));animation:st-beat 1.3s ease-in-out infinite;filter:drop-shadow(0 .5cqh 1cqh rgba(0,0,0,.35))}
@keyframes st-beat{0%,40%,100%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}12%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.18)}26%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.06)}}
.st-kissbar{position:absolute;left:50%;bottom:6cqh;transform:translateX(-50%);align-items:center;gap:2.2cqh;padding:1.8cqh 4.5cqh 1.5cqh;border-radius:99cqh;
  background:linear-gradient(180deg,#ff5b93,var(--st-kiss-3));font-size:10cqh;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;max-width:90cqw;
  box-shadow:0 0 0 .6cqh rgba(255,255,255,.92),0 2cqh 6cqh rgba(224,22,79,.6)}
.st-kissbar svg{flex:none;width:7cqh;height:7cqh;animation:st-thump 1.3s ease-in-out infinite}
.st-kissbar span{overflow:hidden;text-overflow:ellipsis}
@keyframes st-thump{12%{transform:scale(1.2)}26%{transform:scale(1.05)}40%{transform:scale(1)}}
.st[data-kind="kiss"] .st-kissbar{display:flex}
.st[data-show="program"][data-kind="kiss"] .st-kissbar{animation:st-rise .6s cubic-bezier(.2,.9,.2,1) .15s both}
@keyframes st-rise{from{transform:translate(-50%,140%);opacity:0}}
.st-ovl{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.st[data-kind="overlay"] .st-ovl{display:block}
.st-bug{position:absolute;top:4cqh;left:4cqh;align-items:center;gap:1.4cqh;padding:1.2cqh 2.2cqh 1cqh;border-radius:1cqh;background:rgba(7,8,14,.75);font-size:4.6cqh;letter-spacing:.06em}
.st[data-kind="live"] .st-bug{display:flex}
@media (prefers-reduced-motion:reduce){.st *,.st{animation:none!important;transition:none!important}}

</style>
<style>
/* Kontrollrom-stil: mørkt for svakt opplyste lokaler. Gult = valgt, rødt = på skjerm (som tally-lys i TV-produksjon). */
:root{--bg:#0c0e16;--panel:#141724;--panel-2:#1b1f31;--line:#262b40;--line-2:#363c58;--fg:#eef0f8;--muted:#9aa0ba;--faint:#646a88;
  --amber:#ffc83d;--pink:#ff3d7f;--red:#ff2e4d;--green:#3ddc97;--ink-on-amber:#1d1500;
  --f-display:Anton,Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--f-ui:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.12em}
h1,h2,h3{margin:0}
h2{font:700 12.5px/1.2 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
kbd{font:600 11px/1 var(--f-ui);padding:3px 6px;border-radius:4px;border:1px solid currentColor;opacity:.75;letter-spacing:0;text-transform:none}

.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.05em;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;gap:.28em}
.brand::before{content:"";width:.42em;height:.42em;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.brand b{font-weight:400;color:var(--amber)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--amber);color:var(--ink-on-amber);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:6px 10px;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.ok{color:var(--fg)}
.chip.ok::before{background:var(--green);box-shadow:0 0 8px var(--green)}
.chip.warn::before{background:var(--amber)}
.chip.err{color:var(--fg)}
.chip.err::before{background:var(--red)}

.big{min-height:64px;border-radius:10px;border:0;padding:8px 16px;font-family:var(--f-display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;transition:background .15s,color .15s,box-shadow .15s}
.big.send{background:var(--red);color:#fff;box-shadow:0 6px 24px rgba(255,46,77,.35)}
.big.send:hover:not(:disabled){filter:brightness(1.08)}
.big.send:disabled{background:#3d1820;color:#ff9aab;box-shadow:none;cursor:default}
.big.back{background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg)}
.big.back.hot{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@keyframes blink{50%{opacity:.35}}

/* Kort for bilder/filtre (deles av kontrollpanel og mobil) */
.item-thumb{position:relative;aspect-ratio:16/10;background:#000;display:grid;place-items:center;overflow:hidden}
.item-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item-thumb.th-ovl{background:repeating-conic-gradient(#2a2e44 0 25%,#1b1f31 0 50%) 0 0/14px 14px}
.item-thumb.th-ovl img{object-fit:contain}
.item-thumb.th-kiss{background:radial-gradient(circle at 50% 60%,#ff7aa6,#c8123f);color:#fff}
.item-thumb.th-kiss svg{width:38%;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.item-thumb.th-live{background:linear-gradient(135deg,#1f2438,#0b0d16)}
.item-thumb.th-live span{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);letter-spacing:.08em;font-size:18px}
.item-thumb.th-live i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
.item-thumb.th-load{background:linear-gradient(90deg,#151826,#20253a,#151826);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Startside ---------- */
.home{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(60% 40% at 50% 0,rgba(255,200,61,.10),transparent 70%),var(--bg)}
.home-in{width:100%;max-width:900px;display:grid;gap:28px}
.home-head{display:grid;gap:14px;justify-items:start}
.brand-xl{font-size:clamp(44px,9vw,84px)}
.bulbs{width:100%;max-width:520px;height:14px;background-repeat:repeat-x;
  background-image:radial-gradient(circle,var(--amber) 0 24%,rgba(255,200,61,.35) 30% 40%,transparent 44%),radial-gradient(circle,rgba(255,200,61,.22) 0 24%,transparent 28%);
  background-size:36px 14px,36px 14px;background-position:0 0,18px 0;animation:chase 1s steps(1,end) infinite}
@keyframes chase{0%{background-position:0 0,18px 0}50%{background-position:18px 0,0 0}}
.lead{font-size:18px;color:var(--muted);max-width:60ch;margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.role{display:grid;gap:8px;align-content:start;padding:22px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;margin:0}
a.role:hover{border-color:var(--line-2)}
.role-kicker{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.role-title{font-family:var(--f-display);font-size:34px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
.role-desc{color:var(--muted);margin-bottom:6px}
.role .btn{justify-self:start}
.code-row{display:flex;gap:8px}
.code-row input{flex:1;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);font-family:var(--f-display);font-size:22px;letter-spacing:.2em;text-transform:uppercase}
.note{margin:0;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,200,61,.35);background:rgba(255,200,61,.07);color:var(--fg)}
.howto{display:grid;gap:16px;padding-top:6px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;counter-reset:f}
.flow li{counter-increment:f;display:grid;align-content:start;gap:4px;padding:14px;border-radius:12px;border:1px solid var(--line)}
.flow li::before{content:counter(f);font-family:var(--f-display);font-size:28px;color:var(--amber);line-height:1}
.flow li span{color:var(--muted);font-size:14px}
.setup{border:1px solid var(--line);border-radius:12px;padding:0 16px;background:var(--panel)}
.setup summary{cursor:pointer;padding:14px 0;font-weight:700}
.setup ol{margin:0 0 16px;padding-left:20px;display:grid;gap:8px;max-width:72ch}
.setup li{color:var(--muted)}
.setup li b{color:var(--fg)}
.privacy{margin:0;color:var(--muted);font-size:14px;max-width:80ch}
.privacy b{color:var(--fg)}

/* ---------- Kontrollpanel ---------- */
body.role-hub{overflow:hidden}
.hub{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
.hub-top{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.code-pill{font-family:var(--f-display);letter-spacing:.14em;font-weight:400;color:var(--amber)}
.hub-main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.hub-left{display:flex;flex-direction:column;gap:12px;padding:16px;min-width:0;min-height:0}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.pv-label{font-family:var(--f-display);letter-spacing:.08em;font-size:16px;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:9px}
.pv-label.live{color:var(--red)}
.pv-label.live::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1s infinite}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{font-size:12.5px;color:var(--faint);padding:4px 10px;border-radius:99px;border:1px solid var(--line);transition:color .2s,border-color .2s}
.steps li b{margin-right:5px}
.steps li.on{color:var(--fg);border-color:var(--line-2)}
.steps li.on b{color:var(--amber)}
.pv-frame{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.pv-box{width:min(100cqw,calc(100cqh * var(--ar,1.7778)));aspect-ratio:var(--ar,1.7778);border-radius:6px;overflow:hidden;outline:3px solid var(--line-2);outline-offset:3px;transition:outline-color .2s,box-shadow .2s}
.pv-box.live{outline-color:var(--red);box-shadow:0 0 44px rgba(255,46,77,.35)}
.actions{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.hub-right{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px;min-height:0}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{position:relative;display:flex;flex-direction:column;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--line-2)}
.item.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.item-num{position:absolute;top:6px;left:6px;font:700 11px/1 var(--f-ui);background:rgba(0,0,0,.7);padding:4px 6px;border-radius:4px}
.item-kind{position:absolute;top:6px;right:6px;font:700 10.5px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:rgba(0,0,0,.7);color:var(--amber)}
.item-kind.k-kiss{color:#ff8fb3}
.item-kind.k-live{color:#ff8a9a}
.item-kind.k-overlay{color:#9fd3ff}
.item-body{display:flex;align-items:center;gap:2px;padding:5px 5px 5px 8px;min-height:40px}
.item-name{flex:1;min-width:0;background:transparent;border:1px solid transparent;font:600 13px/1.3 var(--f-ui);padding:4px 4px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.item-name:hover{border-color:var(--line-2)}
input.item-name:focus{border-color:var(--amber);background:var(--bg);outline:none}
.icon-btn{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:0;background:transparent;color:var(--muted);padding:0}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--fg)}
.icon-btn.armed{background:var(--red);color:#fff}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;margin-top:10px;border:1.5px dashed var(--line-2);border-radius:10px;padding:14px;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop b{color:var(--fg)}
.drop:hover,.drop.over{border-color:var(--amber);background:rgba(255,200,61,.05)}
.settings{border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.settings summary{cursor:pointer;padding:12px 14px;font-weight:700}
.fields{display:grid;gap:14px;padding:4px 14px 16px}
.fields fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
.fields legend{font:700 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding:0}
.field{display:grid;gap:5px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg)}
.field-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:9px;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--amber)}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;font-size:13.5px}
.keys dt{display:flex;gap:4px;flex-wrap:wrap}
.keys dd{margin:0;color:var(--muted)}
.keys p{margin:10px 0 0}

.modal{position:fixed;inset:0;z-index:50;background:rgba(5,6,10,.72);display:grid;place-items:center;padding:16px}
.modal-card{width:100%;max-width:460px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:24px;display:grid;gap:14px;justify-items:center;text-align:center}
.modal-card h3{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.modal-card p{margin:0}
.qr{width:min(280px,70vw);aspect-ratio:1;background:#fff;border-radius:10px;padding:6px}
.qr svg{display:block;width:100%;height:100%}
.bigcode{font-family:var(--f-display);font-size:44px;letter-spacing:.22em;color:var(--amber);line-height:1;padding-left:.22em}
.url{word-break:break-all;font-size:12.5px;color:var(--faint)}
.warn-box{padding:10px 12px;border-radius:8px;border:1px solid rgba(255,200,61,.35);background:rgba(255,200,61,.07);text-align:left;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media (max-width:960px){
  body.role-hub{overflow:auto}
  .hub{height:auto;min-height:100%}
  .hub-main{grid-template-columns:1fr}
  .hub-right{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .pv-frame{flex:none;height:min(56vw,60vh)}
}

/* ---------- Mobilkamera ---------- */
body.role-cam{overflow:hidden;background:#000;overscroll-behavior:none}
.cam{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(210px,31vw,320px);background:#000}
.cam-stage{position:relative;display:grid;place-items:center;container-type:size;min-width:0;min-height:0;touch-action:none;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.cam-box{width:min(100cqw,calc(100cqh * var(--ar,1.7778)));aspect-ratio:var(--ar,1.7778);position:relative;outline:3px solid transparent;outline-offset:-3px;transition:outline-color .2s}
.cam-box .st{border-radius:0}
.cam-box.live{outline-color:var(--red)}
.cam-status{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));max-width:calc(100% - 90px);background:rgba(12,14,22,.8);z-index:2}
.cam-tally{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:2;display:none;background:var(--red);color:#fff;font-family:var(--f-display);font-size:18px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:6px;box-shadow:0 0 18px rgba(255,46,77,.6)}
.cam.live .cam-tally{display:block}
.cam-flip{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:2;width:46px;height:46px;border-radius:50%;background:rgba(12,14,22,.7);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;padding:0}
.cam-flip svg{width:22px;height:22px}
.cam-panel{display:flex;flex-direction:column;gap:10px;min-height:0;background:var(--panel);border-left:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) 10px}
.cam-step{font:700 11.5px/1.35 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cam.live .cam-step{color:var(--red)}
.cam-items{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:8px;align-content:start;-webkit-overflow-scrolling:touch}
.citem{display:block;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);padding:0;overflow:hidden;text-align:left;min-width:0}
.citem.sel{box-shadow:0 0 0 2px var(--amber);border-color:var(--amber)}
.citem span{display:block;font:600 12px/1.25 var(--f-ui);padding:5px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-items .empty{grid-column:1/-1;margin:0;color:var(--muted);font-size:13px}
.zoom{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-ui);color:var(--muted)}
.zoom input{flex:1;min-width:0;accent-color:var(--amber);height:28px}
.zoom output{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.rotate-hint{display:none;margin:0;font-size:12.5px;color:var(--amber)}
.cam-actions{display:grid;gap:8px}
.cam-actions .big{min-height:56px;font-size:20px}
@media (orientation:portrait){
  .cam{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .cam-stage{height:calc(56.25vw + env(safe-area-inset-top,0px));padding-left:0}
  .cam-panel{border-left:0;border-top:1px solid var(--line);padding-top:12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .cam-items{flex:none;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:38%;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
  .rotate-hint{display:block}
  .cam-actions{margin-top:auto}
  .cam-actions .big{min-height:68px;font-size:24px}
}
.cam-start{position:fixed;inset:0;z-index:20;overflow:auto;display:grid;place-items:center;background:radial-gradient(60% 40% at 50% 0,rgba(255,200,61,.10),transparent 70%),var(--bg);
  padding-block:max(24px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cam-start-in{width:100%;max-width:420px;display:grid;gap:16px;justify-items:center;text-align:center}
.cam-start h1{font-family:var(--f-display);font-weight:400;font-size:44px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.cam-start p{margin:0}
.cam-start .big{width:100%}
.cam-start .err{color:#ff9aab;background:rgba(255,46,77,.1);border:1px solid rgba(255,46,77,.4);border-radius:8px;padding:10px 12px;text-align:left}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      r.onupgradeneeded = () => { r.result.createObjectStore('images', { keyPath: 'id' }); r.result.createObjectStore('misc'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(name, mode, fn) {
    const d = await db();

      const t = d.transaction(name, mode);
      const req = fn(t.objectStore(name));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }

    all: () => run('images', 'readonly', s => s.getAll()),

}

  el('btn-send').addEventListener('click', goLive);
  el('btn-back').addEventListener('click', goNeutral);

  /* ---- Tilkoblingsvindu (QR) ---- */
  function phoneUrl() {
    if (isFile) { const b = (S.settings.appUrl || '').trim(); return /^https:\/\//i.test(b) ? b.replace(/#.*$/, '') + '#kamera=' + S.code : ''; }
    return location.origin + location.pathname + location.search + '#kamera=' + S.code;
  }
  function openModal() {
    const url = phoneUrl();
    el('bigcode').textContent = S.code;
    el('mc-url').textContent = url;
    el('mc-file').hidden = !!url;
    el('qr').hidden = !url;
    if (url && window.qrcode) {
      try { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); el('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 3, scalable: true }); }
      catch (e) { el('qr').hidden = true; }
    }
    el('modal').hidden = false; el('mc-close').focus();
  }
  function closeModal() { el('modal').hidden = true; }
  el('btn-connect').addEventListener('click', openModal);
  el('mc-close').addEventListener('click', closeModal);
  el('modal').addEventListener('click', e => { if (e.target === el('modal')) closeModal(); });

  /* ---- Nettverk: mobil -> kontrollpanel ---- */
  const stateMsg = () => ({
    t: 'state', selected: S.selected, live: S.live, aspect: S.aspect,
    items: S.items.map(i => ({ id: i.id, kind: i.kind, name: i.name, builtin: !!i.builtin })),
    texts: { lookTitle: S.settings.lookTitle, kissText: S.settings.kissText }
  });
  function broadcast(m) { S.conns.forEach(c => { if (c.open) { try { c.send(m); } catch (e) {} } }); }
  function broadcastThumb(id) { const data = S.thumbs.get(id); if (data) broadcast({ t: 'thumb', id, data }); }
  function onPhoneMsg(conn, d) {
    if (!d || typeof d !== 'object') return;
    switch (d.t) {
      case 'hello':
        try { conn.send(stateMsg()); S.items.forEach(i => { const data = S.thumbs.get(i.id); if (data) conn.send({ t: 'thumb', id: i.id, data }); }); } catch (e) {}
        break;
      case 'ping': try { conn.send({ t: 'pong' }); } catch (e) {} break;
      case 'select': select(String(d.id)); break;
      case 'send': goLive(); break;
      case 'back': goNeutral(); break;
      case 'zoom': S.dzoom = clamp(+d.v || 1, 1, 4); updateStages(); break;
    }
  }
  function restartPeer(ms) {
    clearTimeout(S.retryT);
    S.retryT = setTimeout(() => { if (S.peer) { try { S.peer.destroy(); } catch (e) {} } S.peer = null; startPeer(); }, ms);
  }
  function startPeer() {
    if (!PeerCtor) { updateChips(); return; }
    S.peerOk = false; updateChips();
    const p = new PeerCtor(peerIdFor(S.code), peerOpts());
    S.peer = p;
    p.on('open', () => { if (S.peer !== p) return; S.peerOk = true; S.peerMsg = ''; updateChips(); });
    p.on('connection', conn => {
      conn.on('open', () => { S.conns.add(conn); updateChips(); });
      conn.on('data', d => onPhoneMsg(conn, d));
      const gone = () => { S.conns.delete(conn); updateChips(); };
      conn.on('close', gone); conn.on('error', gone);
    });
    p.on('call', call => {
      if (S.call && S.call !== call) { try { S.call.close(); } catch (e) {} }
      S.call = call;
      const gone = () => {
        if (S.call !== call) return;
        S.call = null; S.phoneStream = null; S.dzoom = 1;
        if (S.source === 'phone') applyStream(null); else updateChips();
      };
      call.on('stream', s => { if (S.call !== call) return; S.phoneStream = s; if (S.source === 'phone') applyStream(s); else updateChips(); });
      call.on('close', gone); call.on('error', gone);
      call.answer();
      const pc = call.peerConnection;
      if (pc) pc.addEventListener('iceconnectionstatechange', () => { if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') { try { call.close(); } catch (e) {} gone(); } });
    });
    p.on('disconnected', () => {
      if (S.peer !== p || p.destroyed) return;
      S.peerOk = false; updateChips();
      setTimeout(() => { if (S.peer === p && !p.destroyed && p.disconnected) { try { p.reconnect(); } catch (e) { restartPeer(0); } } }, 2000);
    });
    p.on('error', err => {
      if (S.peer !== p) return;
      const t = err && err.type;
      console.warn('PeerJS', t, err);
      if (t === 'unavailable-id') { S.peerMsg = 'Koden er i bruk et annet sted – prøver igjen …'; S.peerOk = false; updateChips(); restartPeer(5000); }
      else if (['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable'].includes(t)) {
        S.peerMsg = 'Ingen kontakt med tilkoblingstjenesten – sjekk internett. Prøver igjen …'; S.peerOk = false; updateChips(); restartPeer(4000);
      }
    });
  }

  /* ---- Oppstart ---- */
  (async () => {
    try {
      const recs = (await idb.all()).sort((a, b) => a.order - b.order);
      for (const r of recs) {
        S.items.push(r); S.urls.set(r.id, URL.createObjectURL(r.blob));
        makeThumb(r).then(t => { S.thumbs.set(r.id, t); broadcastThumb(r.id); }).catch(() => {});
      }
      const nb = await idb.getMisc('neutral');
      if (nb) { S.neutralUrl = URL.createObjectURL(nb); el('btn-nimg-clear').hidden = false; }
    } catch (e) { console.warn('IndexedDB', e); }
    if (!S.items.some(i => i.id === S.selected)) S.selected = S.items[0].id;
    renderItems(); render();
  })();
  pvBox.style.setProperty('--ar', S.aspect.toFixed(4));
  renderItems(); render(); updateChips();
  listCams().then(() => { if (S.source !== 'phone') setSource(el('sel-source').value); });
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', listCams);
  startPeer();
  window.__crowdcam = { S, goLive, goNeutral, select };
}

/* ================= Mobilkamera ================= */
function startCamera(code) {
  document.title = 'CrowdCam – kamera';
  document.body.className = 'role-cam';
  APP.innerHTML = `
  <div class="cam" id="cam">
    <div class="cam-stage" id="cam-stage">
      <div class="cam-box" id="cam-box"></div>
      <div class="cam-status chip warn" id="cam-status" role="status">Kobler til …</div>
      <div class="cam-tally">På skjerm</div>
      <button class="cam-flip" id="cam-flip" type="button" aria-label="Bytt mellom kameraene foran og bak">${ICON.flip}</button>
    </div>
    <div class="cam-panel">
      <div class="cam-step" id="cam-step"></div>
      <div class="cam-items" id="cam-items"></div>
      <div class="zoom"><label for="zoom">Zoom</label><input type="range" id="zoom" min="1" max="4" step="0.05" value="1"><output id="zoom-val" for="zoom">1.0×</output></div>
      <p class="rotate-hint">Snu mobilen på tvers, så fyller bildet storskjermen.</p>
      <div class="cam-actions">
        <button class="big send" id="c-send" type="button"><span class="lbl">Send til skjerm</span></button>
        <button class="big back" id="c-back" type="button">Tilbake</button>
      </div>
    </div>
  </div>
  <div class="cam-start" id="cam-start">
    <div class="cam-start-in">
      <div class="brand">CROWD<b>CAM</b></div>
      <h1>Kamera</h1>
      <p class="muted">Kobler til kontrollpanelet med kode <b class="mono">${esc(code)}</b></p>
      <button class="big send" id="cam-go" type="button">Start kamera</button>
      <p class="err" id="cam-err" hidden></p>
      <ul class="tips"><li>Hold mobilen på tvers.</li><li>Ingenting tas opp eller lagres. Bildet går direkte til kontrollpanelet.</li><li>Skjermen holdes våken så lenge appen er åpen.</li></ul>
      <a class="small muted" href="#">Feil kode? Gå til startsiden</a>
    </div>
  </div>`;

  const el = id => document.getElementById(id);
  const C = {
    code, hubId: peerIdFor(code), items: [], thumbs: new Map(), selected: null, live: false,
    texts: { lookTitle: DEFAULT_SETTINGS.lookTitle, kissText: DEFAULT_SETTINGS.kissText }, aspect: 16 / 9,
    stream: null, facing: store.get('facing', 'environment'), zoom: 1, native: false,
    peer: null, conn: null, call: null, linkOk: false, lastPong: 0, dialT: 0, rebuildT: 0, wake: null
  };
  const stage = new Stage(el('cam-box'));
  const cur = () => C.items.find(i => i.id === C.selected);
  const props = () => ({ show: true, item: cur(), imgUrl: C.thumbs.get(C.selected), texts: Object.assign({}, DEFAULT_SETTINGS, C.texts), neutralUrl: null, dzoom: C.native ? 1 : C.zoom });
  const renderStage = () => stage.update(props());

  function status(cls, txt) { const s = el('cam-status'); s.className = 'cam-status chip ' + cls; s.textContent = txt; }
  function send(m) { if (C.conn && C.conn.open) { try { C.conn.send(m); return true; } catch (e) {} } return false; }
  function buzz() { try { navigator.vibrate && navigator.vibrate(35); } catch (e) {} }

  function renderItems() {
    el('cam-items').innerHTML = C.items.length
      ? C.items.map(it => `<button class="citem${it.id === C.selected ? ' sel' : ''}" type="button" data-id="${esc(it.id)}" aria-pressed="${it.id === C.selected}">${thumbHTML(it, C.thumbs.get(it.id))}<span>${esc(it.name || KIND_LABEL[it.kind])}</span></button>`).join('')
      : '<p class="empty">Bildene fra kontrollpanelet dukker opp her når mobilen er koblet til.</p>';
  }
  function renderUI() {
    el('cam').classList.toggle('live', C.live);
    el('cam-box').classList.toggle('live', C.live);
    el('c-send').disabled = C.live;
    el('c-send').querySelector('.lbl').textContent = C.live ? 'På skjerm' : 'Send til skjerm';
    el('c-back').classList.toggle('hot', C.live);
    el('cam-step').textContent = C.live ? '4 · På skjerm nå – trykk Tilbake når dere er ferdige' : '1 Velg bilde · 2 Finn person · 3 Send';
  }
  el('cam-items').addEventListener('click', e => {
    const b = e.target.closest('.citem'); if (!b) return;
    C.selected = b.dataset.id; send({ t: 'select', id: C.selected });
    $$('.citem', el('cam-items')).forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
    renderStage();
  });
  el('c-send').addEventListener('click', () => {
    if (!send({ t: 'send' })) { status('err', 'Ikke tilkoblet – ikke sendt'); return; }
    C.live = true; renderUI(); buzz();
  });
  el('c-back').addEventListener('click', () => { send({ t: 'back' }); C.live = false; renderUI(); });

  /* ---- Kamera ---- */
  async function openCamera() {
    if (C.stream) C.stream.getTracks().forEach(t => t.stop());
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: C.facing }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30, max: 30 } }
    });
    C.stream = s; stage.setStream(s);
    const track = s.getVideoTracks()[0];
    try { track.contentHint = 'motion'; } catch (e) {}
    setupZoom(track);
    const pc = C.call && C.call.peerConnection;
    if (pc) {
      const snd = pc.getSenders().find(x => !x.track || x.track.kind === 'video');
      if (snd) { try { await snd.replaceTrack(track); } catch (e) { redial(0); } }
    }
  }
  function camErr(e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') return 'Appen fikk ikke bruke kameraet. Gi tilgang i nettleserens innstillinger for denne siden og prøv igjen.';
    if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Fant ikke noe kamera på denne enheten.';
    if (n === 'NotReadableError') return 'Kameraet er opptatt. Lukk andre apper som bruker kameraet og prøv igjen.';
    return 'Kunne ikke starte kameraet' + (e && e.message ? ': ' + e.message : '.');
  }
  function setupZoom(track) {
    const z = el('zoom');
    let caps = {};
    try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) {}
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      C.native = true;
      z.min = caps.zoom.min; z.max = Math.min(caps.zoom.max, 10); z.step = caps.zoom.step || 0.1;
      let v = caps.zoom.min; try { v = track.getSettings().zoom || v; } catch (e) {}
      z.value = v; C.zoom = v;
    } else {
      C.native = false; z.min = 1; z.max = 4; z.step = 0.05; C.zoom = clamp(C.zoom, 1, 4); z.value = C.zoom;
    }
    el('zoom-val').textContent = (+z.value).toFixed(1) + '×';
    sendZoom(); renderStage();
  }
  let zoomRaf = 0, zoomSendT = 0, lastZoomSent = 0;
  function setZoom(v) {
    const z = el('zoom');
    v = clamp(v, +z.min, +z.max); z.value = v; C.zoom = v;
    el('zoom-val').textContent = v.toFixed(1) + '×';
    if (zoomRaf) return;
    zoomRaf = requestAnimationFrame(() => {
      zoomRaf = 0;
      if (C.native) { const t = C.stream && C.stream.getVideoTracks()[0]; if (t) t.applyConstraints({ advanced: [{ zoom: C.zoom }] }).catch(() => {}); }
      renderStage(); sendZoom();
    });
  }
  function sendZoom() {
    const go = () => { lastZoomSent = Date.now(); send({ t: 'zoom', v: C.native ? 1 : C.zoom }); };
    clearTimeout(zoomSendT);
    if (Date.now() - lastZoomSent > 90) go(); else zoomSendT = setTimeout(go, 90);
  }
  el('zoom').addEventListener('input', e => setZoom(+e.target.value));
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  let pinch = null;
  const stEl = el('cam-stage');
  stEl.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: C.zoom }; }, { passive: true });
  stEl.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { e.preventDefault(); setZoom(pinch.z * dist(e.touches) / pinch.d); } }, { passive: false });
  stEl.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
  el('cam-flip').addEventListener('click', async () => {
    C.facing = C.facing === 'environment' ? 'user' : 'environment'; store.set('facing', C.facing); C.zoom = 1;
    try { await openCamera(); } catch (e) { status('err', camErr(e)); }
  });
  async function wakeLock() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') C.wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || el('cam-start').hidden === false) return;
    wakeLock();
    const t = C.stream && C.stream.getVideoTracks()[0];
    if (!t || t.readyState === 'ended') { try { await openCamera(); } catch (e) { status('err', camErr(e)); } }
    if (!C.linkOk) redial(0);
  });

  /* ---- Nettverk ---- */
  function connectPeer() {
    if (!PeerCtor) { status('err', 'Tilkoblingsbiblioteket mangler'); return; }
    clearTimeout(C.rebuildT); clearTimeout(C.dialT);
    closeLinks();
    if (C.peer) { try { C.peer.destroy(); } catch (e) {} }
    status('warn', 'Kobler til …');
    const p = new PeerCtor(peerOpts());
    C.peer = p;
    p.on('open', () => { if (C.peer === p) dial(); });
    p.on('disconnected', () => {
      if (C.peer !== p || p.destroyed) return;
      setTimeout(() => { if (C.peer === p && !p.destroyed && p.disconnected) { try { p.reconnect(); } catch (e) { connectPeer(); } } }, 1500);
    });
    p.on('error', err => {
      if (C.peer !== p) return;
      const t = err && err.type;
      if (t === 'peer-unavailable') { C.linkOk = false; status('warn', `Finner ikke kontrollpanelet med kode ${code}. Er det åpent? Prøver igjen …`); redial(3000); }
      else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected', 'unavailable-id', 'ssl-unavailable'].includes(t)) {
        C.linkOk = false; status('warn', 'Ingen kontakt med nettet – prøver igjen …');
        clearTimeout(C.rebuildT); C.rebuildT = setTimeout(connectPeer, 4000);
      } else { console.warn('PeerJS', t, err); redial(3000); }
    });
  }
  function closeLinks() {
    const { conn, call } = C; C.conn = null; C.call = null;
    try { conn && conn.close(); } catch (e) {}
    try { call && call.close(); } catch (e) {}
  }
  function redial(ms) {
    clearTimeout(C.dialT);
    C.dialT = setTimeout(() => {
      if (!C.peer || C.peer.destroyed) { connectPeer(); return; }
      if (C.peer.disconnected) { try { C.peer.reconnect(); } catch (e) {} redial(2000); return; }
      if (!C.peer.open) { redial(1000); return; }
      dial();
    }, ms);
  }
  function dial() {
    closeLinks(); C.linkOk = false;
    const p = C.peer;
    const conn = p.connect(C.hubId, { reliable: true });
    C.conn = conn;
    const lost = () => { if (C.conn === conn) { C.linkOk = false; status('warn', 'Mistet kontakten – kobler til igjen …'); redial(1500); } };
    conn.on('open', () => {
      if (C.conn !== conn) return;
      C.lastPong = Date.now(); C.linkOk = true; status('ok', 'Tilkoblet');
      conn.send({ t: 'hello' }); sendZoom();
    });
    conn.on('data', d => { if (C.conn === conn) onHub(d); });
    conn.on('close', lost); conn.on('error', lost);
    if (C.stream) {
      const call = p.call(C.hubId, C.stream);
      C.call = call;
      if (call) {
        const lostCall = () => { if (C.call === call) { status('warn', 'Videoen falt ut – kobler til igjen …'); redial(1500); } };
        call.on('close', lostCall); call.on('error', lostCall);
        const pc = call.peerConnection;
        if (pc) pc.addEventListener('iceconnectionstatechange', () => {
          if (C.call !== call) return;
          const s = pc.iceConnectionState;
          if (s === 'failed') lostCall();
          if (s === 'connected' || s === 'completed') boost(pc);
        });
      }
    }
  }
  function boost(pc) {
    try {
      const snd = pc.getSenders().find(s => s.track && s.track.kind === 'video'); if (!snd) return;
      const prm = snd.getParameters();
      if (!prm.encodings || !prm.encodings.length) return;
      prm.encodings[0].maxBitrate = 4000000;
      snd.setParameters(prm).catch(() => {});
    } catch (e) {}
  }
  function onHub(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'pong') { C.lastPong = Date.now(); return; }
    if (d.t === 'thumb') { C.thumbs.set(d.id, d.data); renderItems(); renderStage(); return; }
    if (d.t === 'state') {
      C.lastPong = Date.now();
      C.items = Array.isArray(d.items) ? d.items : [];
      C.selected = d.selected;
      const was = C.live; C.live = !!d.live;
      if (d.texts) C.texts = d.texts;
      if (d.aspect) { C.aspect = d.aspect; el('cam-box').style.setProperty('--ar', (+d.aspect).toFixed(4)); }
      renderItems(); renderUI(); renderStage();
      if (C.live && !was) buzz();
    }
  }
  setInterval(() => {
    if (C.conn && C.conn.open) {
      send({ t: 'ping' });
      if (C.linkOk && Date.now() - C.lastPong > 8000) { C.linkOk = false; status('warn', 'Får ikke svar fra kontrollpanelet – kobler til igjen …'); redial(0); }
    }
  }, 2000);

  /* ---- Start ---- */
  el('cam-go').addEventListener('click', async () => {
    const err = el('cam-err'); err.hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      err.textContent = 'Nettleseren gir ikke tilgang til kameraet her. Appen må åpnes fra en https-adresse.'; err.hidden = false; return;
    }
    el('cam-go').disabled = true;
    try { await openCamera(); } catch (e) { err.textContent = camErr(e); err.hidden = false; el('cam-go').disabled = false; return; }
    el('cam-start').hidden = true;
    const r = document.documentElement;
    if (r.requestFullscreen) r.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    wakeLock();
    connectPeer();
  });
  renderItems(); renderUI(); renderStage();
  window.__crowdcamCam = C;
}

          <li><b>Koble PC-en til storskjermen</b> med HDMI og velg «Utvid» (ikke «Dupliser») i skjerminnstillingene.</li>
          <li><b>Åpne appen i Chrome eller Edge på PC-en</b> og velg Kontrollpanel. Trykk «Åpne storskjerm», dra vinduet over til storskjermen og klikk i det for fullskjerm.</li>
          <li><b>Trykk «Koble til mobil»</b> og skann QR-koden med mobilen som skal filme. Trykk «Start kamera» og gi tilgang til kameraet.</li>
          <li><b>Begge må ha internett</b> (Wi-Fi eller mobildata). Videoen går raskest når mobil og PC er på samme Wi-Fi.</li>
        </ol>
      </details>
      <p class="privacy"><b>Personvern:</b> Appen tar ikke opp og lagrer ikke video. Bildet går kryptert fra mobilen til PC-en og vises bare på skjermen. Gi publikum beskjed om at kamera brukes (skilt eller speaker), og trykk «Tilbake» med en gang hvis noen ikke vil være med.</p>
    </section>
  </div></div>`;
  $('#cam-form').addEventListener('submit', e => {
    e.preventDefault();
    const c = $('#code-in').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length < 4) { $('#code-in').focus(); toast('Skriv inn koden fra kontrollpanelet.'); return; }
    location.hash = 'kamera=' + c;
  });
}

/* ================= Ruting ================= */
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h === 'kontroll') return startHub();
  const m = h.match(/^kamera=([A-Za-z0-9]{4,8})$/);
  if (m) return startCamera(m[1].toUpperCase());
  startHome();
}
window.addEventListener('hashchange', () => location.reload());
route();
})();

</script>
